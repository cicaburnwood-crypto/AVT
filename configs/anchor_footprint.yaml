query_mode: anchor_motion

footprint:
  # Legacy metadata only. Footprint query points are disabled in this repo.
  width_ratio: 0.25
  height_ratio: 0.20

sampling:
  enabled: true
  # Legacy footprint sampling fields are ignored by anchor_motion mode.
  max_query_points: 768
  window_size: 20
  min_points_per_frame: 8
  max_points_per_frame: 20
  sample_at_edges: true
  edge_offset_ratio: 0.10
  use_clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: 8
  n_octave_layers: 5
  contrast_threshold: 0.018
  edge_threshold: 20.0
  sigma: 1.5

  # Full-frame anchors are sampled only in reverse_time 0, tracked backward
  # through the inverse sequence, then used to estimate frame-level motion.
  anchors:
    enabled: true
    max_query_points: 512
    window_size: null
    min_points_per_frame: 32
    max_points_per_frame: 128
    n_octave_layers: 3
    contrast_threshold: 0.008
    edge_threshold: 15.0
    sigma: 1.2
